[project]
name = "studyapp-backend"
version = "0.1.0"
description = "Source-grounded study app API (FastAPI + pgvector + Gemini)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.1",
    "fastembed>=0.9.0",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "pgserver>=0.1.4",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.20.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "tiktoken>=0.14.0",
    "truststore>=0.10.5",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
